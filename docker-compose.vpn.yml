# Optional fail-closed VPN deployment for all StreamVault upstream traffic.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d --build
#
# The server shares Gluetun's network namespace. Port 3002 remains unchanged
# for every frontend client, while Xtream API, artwork, EPG, live, VOD, series,
# recording, and redirect traffic leave through the VPN tunnel.
services:
  vpn:
    image: qmcgaw/gluetun:v3.41.1
    container_name: streamvault-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "3002:3001"
    volumes:
      - streamvault_vpn_data:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:?Set VPN_SERVICE_PROVIDER in .env}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Finland}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      # Gluetun's kill switch blocks non-tunnel egress. This exception only
      # permits LAN clients to enter the StreamVault listener.
      - FIREWALL_INPUT_PORTS=3001
      - TZ=${TZ:-Europe/Helsinki}
    restart: unless-stopped

  server:
    # Remove the base service's own port binding: it now lives on vpn's stack.
    ports: !reset []
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
        restart: true

volumes:
  streamvault_vpn_data:
